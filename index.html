<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="企業法">
<meta name="theme-color" content="#ECEEE7">
<title>企業法 すきまトレーナー</title>
<style>
:root{
  color-scheme:light only;
  --paper:#ECEEE7; --card:#F7F6F1; --ink:#22252A; --sub:#6C7078; --faint:#9A9E9F;
  --line:#D2CFC4; --ao:#2C4F86; --shu:#A4362C; --hold:#8A7430;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --gothic:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#ECEEE7 !important}
body{margin:0;padding:0;background:#ECEEE7 !important;color:#22252A !important;
  font-family:var(--gothic);padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%}
#app{max-width:660px;margin:0 auto;padding:0 16px 44px;background:var(--paper);
  color:var(--ink);min-height:100vh}
@media (prefers-color-scheme:dark){
  html,body{background:#ECEEE7 !important;color:#22252A !important}
  #app{background:#ECEEE7;color:#22252A}
}
h1,h2,h3{font-weight:600;margin:0}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hd{display:flex;align-items:baseline;justify-content:space-between;padding:16px 0 10px}
.hd .ttl{font-size:15px;letter-spacing:.04em}
.hd .sub{font-size:11px;color:var(--faint)}
.rule{height:1px;background:var(--line)}

/* 進捗バー */
.stair{display:flex;gap:3px;margin:12px 0 4px}
.stair div{flex:1;text-align:center}
.stair b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.stair span{display:block;font-size:9.5px;color:var(--faint);margin-top:2px}
.stair .on b{color:var(--ao)}

/* 問題カード */
.qwrap{margin:14px 0 0}
.tag{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--sub);margin-bottom:10px;flex-wrap:wrap}
.tag .rk{border:1px solid var(--line);border-radius:3px;padding:1px 5px;font-weight:600}
.tag .rk.A{color:var(--shu);border-color:var(--shu)}
.tag .rk.B{color:var(--ao);border-color:var(--ao)}
.tag .st{color:var(--hold)}

.tag .again{background:var(--hold);color:var(--paper);border-radius:3px;padding:1px 5px;font-weight:600}
.tag .hot{background:var(--shu);color:var(--paper);border-radius:3px;padding:1px 5px;font-weight:600}
.q{font-family:var(--mincho);font-size:17.5px;line-height:1.92;letter-spacing:.01em;
   text-align:justify;word-break:normal;line-break:strict;overflow-wrap:anywhere}
.qn{color:var(--faint);font-size:13px;margin-right:.4em}

/* 回答ボタン */
.ans{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:22px 0 0}
.ans button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;
  padding:16px 0;font-size:21px;font-weight:600;transition:transform .08s}
.ans button:active{transform:scale(.97)}
.ans button small{display:block;font-size:10px;font-weight:400;color:var(--faint);margin-top:3px}
.ans .o{color:var(--ao)} .ans .x{color:var(--shu)} .ans .h{color:var(--hold);font-size:19px}

/* 判定 */
.verdict{margin:20px 0 0;padding-left:13px;border-left:3px solid var(--line)}
.verdict.ok{border-color:var(--ao)} .verdict.ng{border-color:var(--shu)}
.vhead{font-size:13px;font-weight:600;margin-bottom:7px}
.verdict.ok .vhead{color:var(--ao)} .verdict.ng .vhead{color:var(--shu)}
.why{font-family:var(--mincho);font-size:15px;line-height:1.85;text-align:justify}
.arts{font-size:11.5px;color:var(--sub);margin-top:8px}

.disc{margin-top:14px}
.disc>button{display:block;width:100%;text-align:left;border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;font-size:13px;background:var(--card);color:var(--sub)}
.disc>button b{color:var(--ink);font-weight:600}
.body{margin-top:10px;padding:13px;background:var(--card);border-radius:10px;
  font-family:var(--mincho);font-size:14px;line-height:1.85;text-align:justify}
.body .src{display:block;font-family:var(--gothic);font-size:10.5px;color:var(--faint);margin-top:9px}
.note{font-size:11.5px;color:var(--faint);line-height:1.6;margin-top:9px}

.next{display:flex;gap:9px;margin-top:22px}
.next button{flex:1;border-radius:12px;padding:15px 0;font-size:15px;font-weight:600;
  background:var(--ink);color:var(--paper)}
.next .ghost{flex:0 0 auto;padding:15px 15px;background:none;border:1.5px solid var(--line);
  color:var(--sub);font-weight:400;font-size:12.5px}

/* ホーム */
.mode{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:14px;margin-bottom:9px}
.mode b{font-size:15px;display:block}
.mode span{font-size:11.5px;color:var(--sub);display:block;margin-top:3px;line-height:1.5}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 16px}
.seg button{flex:1;padding:9px 0;font-size:12.5px;background:var(--card);color:var(--sub);
  border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--paper);font-weight:600}
.lbl{font-size:11.5px;color:var(--faint);margin:18px 0 0}
.pace{font-size:12px;color:var(--sub);line-height:1.65;margin:10px 0 0;
  padding:11px 13px;background:var(--card);border-radius:10px}
.pace em{font-style:normal;font-weight:600;color:var(--ink)}
.pace.warn{border:1px solid var(--shu);color:var(--shu)}

/* ダッシュボード */
.row{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.5px}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .num{font-variant-numeric:tabular-nums;color:var(--sub);font-size:11.5px;flex:0 0 auto}
.bar{flex:0 0 72px;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ao)}
.miss{font-size:13px;line-height:1.7;padding:9px 0;border-bottom:1px solid var(--line)}
.miss em{font-style:normal;color:var(--shu);font-size:11px;margin-left:6px}
.back{font-size:12.5px;color:var(--sub);padding:10px 0;border-bottom:1px solid var(--line);line-height:1.7}
.back b{color:var(--ink);font-weight:600}
.gl{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.7}
.gl b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}
.caution{margin-top:10px;padding:10px 12px;border-left:3px solid var(--hold);
  background:var(--card);font-size:11.5px;line-height:1.7;color:var(--sub);border-radius:0 8px 8px 0}
.caution b{color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:20px;
  padding:6px 12px;font-size:11.5px;color:var(--sub)}
.memo{background:var(--card);border-left:3px solid var(--ao);border-radius:0 10px 10px 0;
  padding:12px 13px;font-size:13.5px;line-height:1.8;white-space:normal;text-align:justify}
.mini input[type=date]{border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:9px;padding:7px 10px;font-size:12.5px;font-family:inherit}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.nav{display:flex;gap:16px;padding:16px 0 0;font-size:12.5px;color:var(--sub)}
.nav button.on{color:var(--ink);font-weight:600}
.big{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.center{text-align:center;padding:26px 0}
.pick{display:block;text-align:center;background:var(--ink);color:var(--paper);
  border-radius:12px;padding:16px 0;font-size:15px;font-weight:600;margin-top:18px;cursor:pointer}
.pick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.lead{margin-top:18px;font-family:var(--mincho);font-size:15px;line-height:1.9;text-align:justify}
.lead b{font-family:var(--gothic);font-size:13.5px}
.alert{background:#F6E3DF;border:1px solid var(--shu);color:var(--shu);border-radius:11px;
  padding:11px 13px;font-size:12px;line-height:1.65;margin:14px 0 0}
.alert b{display:block;font-weight:600;margin-bottom:3px}
textarea{width:100%;min-height:110px;margin-top:9px;padding:10px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:11px;
  font-family:ui-monospace,Menlo,monospace;line-height:1.45;-webkit-user-select:text;user-select:text}
.mini{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.mini button{border:1px solid var(--line);background:var(--card);border-radius:9px;
  padding:8px 13px;font-size:12px}
.time{display:flex;gap:0;margin:12px 0 0;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.time div{flex:1;padding:10px 6px;text-align:center;border-right:1px solid var(--line)}
.time div:last-child{border-right:0}
.time b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.time span{display:block;font-size:10px;color:var(--faint);margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);
  color:var(--paper);padding:9px 16px;border-radius:20px;font-size:12.5px;z-index:9;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
button:focus-visible{outline:2px solid var(--ao);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
var DATA = null;
</script>
<script>
(function(){
"use strict";
var CARDS=[], SH={}, TOPICS=[], BYID={};
var KEY='kigyoho_v1', DKEY='kigyoho_cards_v1';
var GLOSS=[
 ['株主','会社にお金を出した人。出したお金がゼロになる覚悟はするが、それ以上の責任は負わない。'],
 ['取締役','会社の経営をする人。株主総会で選ばれる。'],
 ['取締役会','取締役たちの会議。重要な決定は社長ひとりではなくここで決める。'],
 ['代表取締役','会社を代表して契約などをする人。いわゆる社長。'],
 ['監査役','取締役の仕事ぶりを見張る役。経営には加わらない。'],
 ['会計監査人','決算が正しいかを外からチェックする会計士・監査法人。'],
 ['株主総会','株主が集まって会社の重要事項を多数決で決める場。'],
 ['定款','会社のルールブック。会社を作るときに必ず作る。'],
 ['普通決議／特別決議／特殊決議','多数決のハードルの段階。右にいくほど賛成が多く必要で、重い話に使う。'],
 ['公開会社','株を売るのに会社の承認が要らない会社。株主が誰でもよく、入れ替わる。上場しているという意味ではない。'],
 ['非公開会社','株を売るのに会社の承認が要る会社。身内だけの会社をイメージするとよい。'],
 ['大会社','資本金5億円以上または負債200億円以上の会社。関係者が多いので規制が重くなる。'],
 ['自己株式','会社が自分で持っている自社の株。議決権はない。'],
 ['新株予約権','決まった値段で株を買える権利。クーポンのようなもの。'],
 ['社債','会社の借金の証書。たくさんの人に同じ条件で売る。'],
 ['剰余金の配当','会社のもうけを株主に分けること。'],
 ['資本金・準備金','株主に配れないよう会社に取り分けてあるお金。会社にお金を貸した人の安心材料。'],
 ['分配可能額','株主に配ってよい金額の上限。'],
 ['会社債権者','会社にお金を貸している人や、代金をもらう権利がある人。'],
 ['善意／悪意','法律では「知らなかった／知っていた」という意味。良い悪いの話ではない。'],
 ['対抗できない','相手に対して「こうなっています」と主張できない、という意味。'],
 ['無効／取消し','無効は最初から効き目がない。取消しは、取り消すまでは有効。'],
 ['瑕疵（かし）','欠陥、不備のこと。手続きのミスや内容の違法を指す。'],
 ['登記','会社の情報を、誰でも見られる公の帳簿に載せること。'],
 ['発起人','会社を作る手続きを進める人。定款に署名した人。'],
 ['現物出資','お金ではなくモノ（土地・機械など）で出資すること。'],
 ['持分会社','合名会社・合資会社・合同会社のこと。出資した人が自分で経営もする。'],
 ['組織再編','合併・会社分割・株式交換など、会社の形を組み替えること。'],
 ['単独株主権／少数株主権','1株でも使える権利／一定の株数がないと使えない権利。'],
 ['対世効（たいせいこう）','裁判の結果が、訴えた当事者だけでなく第三者にも及ぶこと。']
];
function initData(d){
  CARDS=d.cards; SH=d.sh||{}; TOPICS=d.topics||[]; BYID={};
  for(var i=0;i<CARDS.length;i++) BYID[CARDS[i].i]=CARDS[i];
}

/* ---------- 保存先：Claude内 → ブラウザ → メモリ ---------- */
var MEM={}, PERSIST='none';
var Store={
  get:function(k){ return Promise.resolve().then(function(){
      if(window.storage&&window.storage.get){ return window.storage.get(k).then(function(r){
          PERSIST='claude'; return r&&r.value!=null?r.value:null; },function(){ return local(k); }); }
      return local(k);
    }); },
  set:function(k,v){ return Promise.resolve().then(function(){
      if(window.storage&&window.storage.set){ return window.storage.set(k,v).then(function(){PERSIST='claude';},
        function(){ lset(k,v); }); }
      lset(k,v);
    }); }
};
function local(k){ try{ var v=localStorage.getItem(k); if(v!=null) return v; }catch(e){}
  return MEM[k]!=null?MEM[k]:null; }
function lset(k,v){ try{ localStorage.setItem(k,v); return; }catch(e){} MEM[k]=v; }
/* 起動時に「本当に残るか」を書き込んで確かめる */
function probe(){
  return Promise.resolve().then(function(){
    if(window.storage&&window.storage.set){
      return window.storage.set(KEY+'_probe','1').then(function(){
        return window.storage.get(KEY+'_probe').then(function(r){
          if(r&&r.value==='1'){ PERSIST='claude'; return; } return lprobe(); }, lprobe); }, lprobe);
    }
    return lprobe();
  });
}
function lprobe(){
  try{ localStorage.setItem(KEY+'_probe','1');
       if(localStorage.getItem(KEY+'_probe')==='1'){ PERSIST='local'; return; } }catch(e){}
  PERSIST='memory';
}

/* ---------- 状態 ---------- */
var S=null, ses=null, view='home', tmp={};
var CYC=[5,7,10,14];                       /* 1周の目標日数（教材：Ａのみ5日、ＡＢＣ全部で10日） */
function cyc(){ return S.cyc||10; }
/* 最長でも1周ぶんで必ず戻ってくるようにする */
function STEPSf(){ var c=cyc();
  if(c<=5) return [1,2,3,c];
  if(c<=7) return [1,3,5,c];
  return [1,3,7,c];
}
function STEPNMf(){ return STEPSf().map(function(d){ return d===1?'翌日':d+'日後'; }); }
function today(){ var d=new Date(); d.setHours(0,0,0,0); return Math.floor(d.getTime()/864e5); }
function fresh(){ return {L:{},log:{},rank:'A',mix:'freq',lv:'e',rt:'on',ses:null,cyc:10,cycStart:null,cycSeen:{},rounds:0,N:{},examStr:null,ver:5}; }
S=fresh();

function load(){ return Store.get(KEY).then(function(v){
    try{ S=v?JSON.parse(v):fresh(); }catch(e){ S=fresh(); }
    if(!S.L)S=fresh(); if(!S.rank)S.rank='A'; if(!S.log)S.log={}; if(!S.mix)S.mix='freq'; if(!S.lv)S.lv='e'; if(!S.rt)S.rt='on'; if(!S.cyc)S.cyc=10; if(!S.cycSeen)S.cycSeen={}; if(!S.N)S.N={};
    if(!S.ver||S.ver<4){                       /* 旧データの段を1つ繰り上げる */
      for(var k in S.L){ var L=S.L[k]; L.st=Math.max(0, Math.min((L.st||0)-1, 3)); }
      S.ver=4;
    }
  }); }
var saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(function(){ Store.set(KEY,JSON.stringify(S)); },220); }

function lawOf(c){
  if(c.t.indexOf('金融商品取引法')===0) return '金商法';
  if(c.t.indexOf('商法総則')>=0) return '商法';
  return '会社法';
}
function weightOf(c){
  if(S.mix==='flat') return 1;
  var r = c.r==='A'?1 : c.r==='B'?0.55 : 0.3;          /* 重要度ランク */
  var h = 1 + 0.55*Math.min(c.hit||0, 4);              /* 過去問の出題回数 */
  return r*h*(c.rec?1.5:1);                            /* 直近3年に出ていれば上乗せ */
}
/* 重みつきの無作為抽出。1論点に偏らないよう上限を設ける */
function weightedPick(pool, n){
  var k=pool.map(function(c){ return {c:c, k:Math.pow(Math.random(), 1/weightOf(c))}; });
  k.sort(function(a,b){ return b.k-a.k; });
  var cap=Math.max(3, Math.ceil(n/3)), cnt={}, out=[], rest=[];
  for(var i=0;i<k.length && out.length<n;i++){
    var c=k[i].c, m=cnt[c.t]||0;
    if(m<cap){ out.push(c); cnt[c.t]=m+1; } else rest.push(c);
  }
  for(var j=0;j<rest.length && out.length<n;j++) out.push(rest[j]);
  return out;
}
function rankOk(c){ return S.rank==='A'?c.r==='A':S.rank==='AB'?c.r!=='C':true; }
function dueList(){ var t=today(),o=[];
  for(var k in S.L){ var L=S.L[k]; if(L.due<=t && BYID[k]) o.push(BYID[k]); }
  return o; }
function newPool(){ var o=[];
  for(var i=0;i<CARDS.length;i++){ var c=CARDS[i]; if(!S.L[c.i] && rankOk(c)) o.push(c); }
  return o; }
function shuffleTopics(list,n){
  var by={},order=[];
  for(var i=0;i<list.length;i++){ var t=list[i].t; if(!by[t]){by[t]=[];order.push(t);} by[t].push(list[i]); }
  for(var i=order.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=order[i];order[i]=order[j];order[j]=x; }
  var out=[],k=0;
  while(out.length<n){ var moved=false;
    for(var a=0;a<order.length;a++){ var q=by[order[a]]; if(q.length>k){ out.push(q[k]); moved=true; if(out.length>=n)break; } }
    if(!moved) break; k++; }
  return out;
}

/* ---------- セッション ---------- */

var MODES={
  r15:{nm:'今日のぶん',f:1},
  r10:{nm:'半分だけ',f:0.5},
  r1:{nm:'1分だけ',n:5},
  rev:{nm:'復習だけ',f:1,revOnly:true},
  note:{nm:'メモのある肢',f:1,noteOnly:true}
};
function poolCards(){ var o=[]; for(var i=0;i<CARDS.length;i++) if(rankOk(CARDS[i])) o.push(CARDS[i]); return o; }
function poolTotal(){ return poolCards().length; }
/* 「1周」＝いまのランクの全肢を1回以上解いた状態。実際に数える */
function cycState(){
  var t=today();
  if(!S.cycStart){ S.cycStart=t; S.cycSeen={}; }
  var pool=poolCards(), seen=0;
  for(var i=0;i<pool.length;i++) if(S.cycSeen[pool[i].i]) seen++;
  var daysLeft=Math.max(1, S.cycStart+cyc()-t);
  return {total:pool.length, seen:seen, remain:pool.length-seen,
          dayIn:t-S.cycStart+1, daysLeft:daysLeft, over:Math.max(0,t-(S.cycStart+cyc()-1)),
          perDay:Math.ceil((pool.length-seen)/daysLeft)};
}
function cap(){ return Math.max(1, cycState().perDay); }
function markSeen(id){
  if(!S.cycSeen) S.cycSeen={};
  if(S.cycSeen[id]) return;
  S.cycSeen[id]=1;
  if(cycState().remain<=0){
    S.rounds=(S.rounds||0)+1; S.cycStart=today(); S.cycSeen={};
    toast(S.rounds+'周おわり。次の周に入ります');
  }
}
function resetCycle(){ S.cycStart=today(); S.cycSeen={}; save(); }
function doneToday(){ var lg=S.log[today()]; return lg?lg.n:0; }
function budget(){ return Math.max(0, cap()-doneToday()); }
/* 復習が枠を超えた日は、超えたぶんを自動で後日に送る（雪だるまを防ぐ） */
function trimDue(list){
  var t=today();
  if(S.defDay===t || list.length<=cap()) return {list:list, moved:0};
  var keep=list.slice(0,cap()), rest=list.slice(cap());
  for(var i=0;i<rest.length;i++) S.L[rest[i].i].due=t+1+Math.floor(i/cap());
  S.defDay=t; save();
  return {list:keep, moved:rest.length};
}
function examDay(){
  if(!S.examStr) return null;
  var p=S.examStr.split('-'); if(p.length!==3) return null;
  var d=new Date(+p[0],+p[1]-1,+p[2]); d.setHours(0,0,0,0);
  return Math.floor(d.getTime()/864e5);
}
/* 実測の1肢あたり秒数。データが少ないうちは15秒と置く */
function secPer(){
  var sec=0,n=0;
  for(var k in S.log){ sec+=S.log[k].sec||0; n+=S.log[k].n||0; }
  return n>=30 ? sec/n : 15;
}
function mins(cards){ return Math.max(1, Math.round(cards*secPer()/60)); }
/* 教材の目安：Ａのみ5日で1周、ＡＢＣ全部なら10日で1周 */
function guideDays(){ return S.rank==='A'?5:(S.rank==='AB'?7:10); }
function rounds(){ var o=outlook(); return o.left!==null?Math.floor(o.left/cyc()):null; }
function outlook(){
  var t=today(), np=0;
  for(var i=0;i<CARDS.length;i++){ var c=CARDS[i]; if(rankOk(c)&&!S.L[c.i]) np++; }
  var rv=0; for(var d=1;d<=7;d++){ for(var k in S.L) if(S.L[k].due===t+d) rv++; }
  var avg=Math.round(rv/7), room=Math.max(0,cap()-avg);
  return {np:np, rev:avg, room:room, days:room>0?Math.ceil(np/room):null,
          left:examDay()!==null?Math.max(0,examDay()-t):null};
}
function startSession(mode,topic){
  var M=MODES[mode]||MODES.r15;
  var done={}; var z=S.ses;
  if(z && z.day===today()) for(var k=0;k<z.i;k++) done[z.q[k]]=1;   /* 今日すでに解いた肢は出さない */
  var total=M.n?M.n:Math.max(1, Math.round(budget()*M.f));
  var seen=S.cycSeen||{};
  var d=dueList().filter(function(c){ return !done[c.i]; });
  if(topic) d=d.filter(function(c){return c.t===topic;});
  if(M.noteOnly) d=CARDS.filter(function(c){ return S.N&&S.N[c.i]&&!done[c.i]; });
  d.sort(function(a,b){ return ((S.L[a.i]||{}).due-(S.L[b.i]||{}).due)||((S.L[b.i]||{}).miss||0)-((S.L[a.i]||{}).miss||0); });
  var fresh1=[], again=[];
  for(var di=0;di<d.length;di++){ (seen[d[di].i]?again:fresh1).push(d[di]); }
  var q=fresh1.slice(0,total), moved=0;
  if(!M.revOnly && !M.noteOnly && q.length<total){
    var np=newPool().filter(function(c){ return !done[c.i] && !seen[c.i]; });
    if(topic) np=np.filter(function(c){return c.t===topic;});
    q=q.concat(weightedPick(np,total-q.length)); }
  /* 今周すでに解いたのに戻ってきた肢（外したもの）は、枠の3割まで上乗せ */
  if(!M.noteOnly && again.length){
    var extra=Math.min(again.length, Math.max(2, Math.round(total*0.3)));
    q=q.concat(again.slice(0,extra));
  }
  if(!q.length){ toast(budget()?'出す問題がありません':'今日の枠は終わりました'); return; }

  ses={mode:mode,topic:topic||null,queue:q,i:0,done:0,ok:0,ng:0,miss:[],rq:[],rstart:undefined,
       pick:null,graded:false,sh:false,shi:0,startAt:Date.now(),tick:Date.now(),sec:0};
  saveSes(); view='card'; render();
}
function saveSes(){
  if(!ses) S.ses=null;
  else S.ses={m:ses.mode, tp:ses.topic, q:ses.queue.map(function(c){return c.i;}),
              i:ses.i, ok:ses.ok, ng:ses.ng, miss:ses.miss, sec:ses.sec||0,
              rq:ses.rq||[], rs:ses.rstart, day:today()};
  save();
}
function resumable(){
  var z=S.ses;
  return (z && z.day===today() && z.q && z.i<z.q.length) ? z : null;
}
function resumeSession(){
  var z=resumable();
  if(!z){ toast('続きがありません'); return; }
  var q=[]; for(var i=0;i<z.q.length;i++){ if(BYID[z.q[i]]) q.push(BYID[z.q[i]]); }
  if(z.i>=q.length){ S.ses=null; save(); toast('続きがありません'); return; }
  ses={mode:z.m, topic:z.tp, queue:q, i:z.i, done:z.i, ok:z.ok, ng:z.ng, miss:z.miss||[],
       rq:z.rq||[], rstart:z.rs, pick:null, graded:false, sh:false, shi:0,
       startAt:Date.now(), tick:Date.now(), sec:z.sec||0};
  view='card'; render();
}
function isRetry(){ return ses && ses.rstart!==undefined && ses.i>=ses.rstart; }
function grade(id,good){
  var t=today(), L=S.L[id]||{st:-1,miss:0,sh:0,nw:1};
  if(L.st===undefined)L.st=-1;
  if(good){ L.st=Math.min(L.st+1,3); }
  else { L.st=0; L.miss=(L.miss||0)+1; }
  L.due=t+STEPSf()[L.st]; L.last=t; S.L[id]=L;
  var lg=S.log[t]||{n:0,ok:0,sec:0}; lg.n++; if(good)lg.ok++;
  if(lg.sec===undefined)lg.sec=0; S.log[t]=lg;
  save();
}
function tick(){
  if(!ses||!ses.tick) return;
  var d=Math.round((Date.now()-ses.tick)/1000);
  ses.tick=Date.now();
  if(d<1) return;
  if(d>90) d=90;                       /* 放置ぶんは数えない */
  var t=today(), lg=S.log[t]||{n:0,ok:0,sec:0};
  lg.sec=(lg.sec||0)+d; S.log[t]=lg; ses.sec=(ses.sec||0)+d;
}
function answer(pick){
  if(ses.graded) return;
  tick();
  var c=ses.queue[ses.i];
  ses.pick=pick; ses.graded=true;
  var good = (pick===c.a && pick!==2);
  if(!isRetry()){
    if(good) ses.ok++;
    else {
      ses.ng++;
      if(ses.miss.indexOf(c.i)<0) ses.miss.push(c.i);
      if(S.rt!=='off' && ses.rq.length<6 && ses.rq.indexOf(c.i)<0) ses.rq.push(c.i);
    }
    grade(c.i,good); markSeen(c.i);
  }
  saveSes(); render();
}
function regradeGuess(){
  var c=ses.queue[ses.i];
  if(isRetry()){ tmp.guessed=true; return render(); }
  grade(c.i,false); ses.ok=Math.max(0,ses.ok-1); ses.ng++;
  if(ses.miss.indexOf(c.i)<0) ses.miss.push(c.i);
  if(S.rt!=='off' && ses.rq.length<6 && ses.rq.indexOf(c.i)<0) ses.rq.push(c.i);
  tmp.guessed=true; saveSes(); toast('翌日に回しました'); render();
}
function nextCard(){
  tick();
  ses.done++; ses.i++; ses.pick=null; ses.graded=false; ses.sh=false; ses.shi=0; tmp.guessed=false; tmp.note=0; tmp.ask=0;
  if(ses.i>=ses.queue.length){
    if(ses.rq && ses.rq.length){          /* 外した肢を、最後に1回だけ出し直す */
      ses.rstart=ses.queue.length;
      for(var k=0;k<ses.rq.length;k++) ses.queue.push(BYID[ses.rq[k]]);
      ses.rq=[]; toast('外した肢をもう一度だけ');
    } else { view='finish'; S.ses=null; }
  }
  saveSes(); render();
}

function esc(s){ return String(s).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];}); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.className='toast on';

function fmt(sec){
  sec=Math.round(sec||0);
  if(sec<30) return '0分';
  var m=Math.max(1,Math.round(sec/60));
  if(m<60) return m+'分';
  return Math.floor(m/60)+'時間'+(m%60?(m%60)+'分':'');
}
function timeStats(){
  var t=today(), d=(S.log[t]&&S.log[t].sec)||0, w=0, all=0, days=0;
  for(var k in S.log){ var sc=S.log[k].sec||0; all+=sc; if(t-k<7){ w+=sc; } if(S.log[k].n) days++; }
  return {day:d, week:w, all:all, days:days};
}

  ms.slice(0,10).forEach(function(x){

        (od.np?('未着手はあと'+od.np+'肢。'):''))
     : '設定すると、あと何周できるかを出します。')+'</div>';

  var ns=[]; for(var nk in (S.N||{})) if(S.N[nk]&&BYID[nk]) ns.push(nk);
  h+='<div class="lbl" style="margin-top:22px">メモ（'+ns.length+'件）</div>';
  if(!ns.length) h+='<div class="note">肢を解いたあとの画面から書けます。書き出しにも一緒に入ります。</div>';
  ns.slice(0,20).forEach(function(nk){
    h+='<div class="miss"><b style="font-weight:600">'+esc(BYID[nk].q.slice(0,40))+'…</b><br>'+
       '<span style="color:var(--sub)">'+esc(S.N[nk].slice(0,110))+(S.N[nk].length>110?'…':'')+'</span></div>'; });
  if(ns.length>20) h+='<div class="note">ほか'+(ns.length-20)+'件。</div>';

  var cs2=cycState();
  h+='<div class="lbl" style="margin-top:22px">周回</div>';
  h+='<div class="note">'+((S.rounds||0)+1)+'周目の'+cs2.dayIn+'日目。'+cs2.seen+' / '+cs2.total+'肢まで。'+
     '完了した周: '+(S.rounds||0)+'周。</div>';
  h+='<div class="mini"><button data-io="cyc">この周を仕切り直す</button></div>';

  var hard=[]; for(var hk in S.L){ if((S.L[hk].miss||0)>=2 && BYID[hk]) hard.push({i:hk,m:S.L[hk].miss}); }
  hard.sort(function(a,b){return b.m-a.m;});
  h+='<div class="lbl" style="margin-top:22px">つまずいている肢の番号</div>';
  h+='<div class="note">2回以上外した肢は'+hard.length+'件。この番号を私（Claude）に渡してもらえれば、'+
     'その肢だけの解説を書き足せます。</div>';
  if(hard.length){
    h+='<div class="mini"><button data-io="hard">番号を書き出す</button></div>';

  h+='<div class="lbl" style="margin-top:22px">記録の保存</div><div class="note">'+
     ({claude:'このチャット内に保存しています。',local:'この端末のブラウザに保存しています。',

function nav(cur){

function render(){
  if(view!=='load' && !CARDS.length) view='load';
  var h = view==='load'?vLoad(): view==='card'?vCard(): view==='finish'?vFinish():
          view==='dash'?vDash(): view==='gloss'?vGloss(): view==='pick'?vPick(): vHome();

  if(view!=='card') window.scrollTo(0,0);
  if(view==='finish') Store.set(KEY,JSON.stringify(S));
}

/* ---------- 操作 ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-go],[data-pick],[data-next],[data-sh],[data-shi],[data-ask],[data-guess],[data-rank],[data-mix],[data-lv],[data-rt],[data-cyc],[data-note],[data-topic],[data-reset],[data-io]');
  if(!el) return;
  var d=el.dataset;
  if(d.rank){ S.rank=d.rank; save(); return render(); }
  if(d.mix){ S.mix=d.mix; save(); return render(); }
  if(d.lv){ S.lv=d.lv; save(); return render(); }
  if(d.rt){ S.rt=d.rt; save(); return render(); }
  if(d.cyc){ S.cyc=Number(d.cyc); save(); return render(); }
  if(d.go){ if(d.go==='load'){ tmp.err=null; view='load'; return render(); }
            if(d.go==='resume'){ return resumeSession(); }
            if(d.go==='home'){ if(ses){ saveSes(); Store.set(KEY,JSON.stringify(S)); }
                               view='home'; ses=null; return render(); }
            if(d.go==='dash'){view='dash'; return render();}
            if(d.go==='gloss'){view='gloss'; return render();}
            if(d.go==='pick'){view='pick'; return render();}
            return startSession(d.go); }
  if(d.topic){ return startSession('r15', d.topic); }
  if(d.pick!==undefined) return answer(Number(d.pick));
  if(d.next) return nextCard();
  if(d.ask){
    if(d.ask==='open'){ tmp.ask=1; return render(); }
    if(d.ask==='close'){ tmp.ask=0; return render(); }
    var at=document.getElementById('ask');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(at.value).then(function(){ toast('コピーしました'); },
        function(){ toast('長押しで選んでコピーしてください'); });
    } else {
      try{ at.select(); at.setSelectionRange(0,999999); document.execCommand('copy'); toast('コピーしました'); }
      catch(e){ toast('長押しで選んでコピーしてください'); }
    }
    return;
  }
  if(d.note){
    var cn=ses.queue[ses.i];
    if(d.note==='edit'){ tmp.note=1; return render(); }
    if(d.note==='cancel'){ tmp.note=0; return render(); }
    if(!S.N) S.N={};
    if(d.note==='save'){
      var v=(document.getElementById('nt').value||'').trim();
      if(v) S.N[cn.i]=v; else delete S.N[cn.i];
      tmp.note=0; Store.set(KEY,JSON.stringify(S));
      toast(v?'メモを保存しました':'メモを消しました'); return render(); }
    if(d.note==='del'){ delete S.N[cn.i]; tmp.note=0; Store.set(KEY,JSON.stringify(S));
      toast('メモを消しました'); return render(); }
  }
  if(d.sh){ ses.sh=!ses.sh; ses.shi=0; return render(); }
  if(d.shi!==undefined){ ses.shi=Number(d.shi); return render(); }
  if(d.guess) return regradeGuess();
  if(d.io){
    if(d.io==='out'||d.io==='in'||d.io==='hard'){ tmp.io=(tmp.io===d.io?null:d.io); return render(); }
    if(d.io==='cyc'){ if(confirm('今周の進み具合をリセットします。学習記録は残ります。')){ resetCycle(); toast('仕切り直しました'); render(); } return; }
    if(d.io==='exam'){ var ev=document.getElementById('exam').value;
      S.examStr=ev||null; Store.set(KEY,JSON.stringify(S));
      toast(ev?'試験日を設定しました':'試験日を消しました'); return render(); }
    var ta=document.getElementById('io');
    if(d.io==='copy'){ ta.select(); ta.setSelectionRange(0,999999);
      try{ document.execCommand('copy'); toast('コピーしました'); }catch(e){ toast('長押しでコピーしてください'); }
      return; }
    if(d.io==='load'){
      try{ var v=JSON.parse(ta.value); if(!v||!v.L) throw 0;
        S=v; if(!S.log)S.log={}; if(!S.rank)S.rank='A';
        Store.set(KEY,JSON.stringify(S)); tmp.io=null; toast('戻しました'); return render();
      }catch(e){ toast('読み取れませんでした'); }
      return; }
  }
  if(d.reset){ if(confirm('学習記録をすべて消します。よろしいですか。')){ S=fresh(); save(); view='home'; render(); } }
});
document.addEventListener('change',function(e){
  var t=e.target; if(!t||t.type!=='file') return;
  var f=t.files&&t.files[0]; if(!f) return;
  var r=new FileReader();
  r.onerror=function(){ tmp.err='ファイルを開けませんでした。もう一度お試しください。'; view='load'; render(); };
  r.onload=function(){
    var d=null;
    try{ d=JSON.parse(r.result); }catch(err){}
    if(!d||!d.cards||!d.cards.length){
      tmp.err='教材データとして読めませんでした。cards.json を選んでください。'; view='load'; return render(); }
    initData(d); tmp.err=null;
    Store.set(DKEY, r.result);
    load().then(function(){ view='home'; render(); toast(CARDS.length+'肢を読み込みました'); });
  };
  r.readAsText(f);
});
document.addEventListener('keydown',function(e){
  if(view!=='card') return;
  if(!ses.graded){ if(e.key==='1'||e.key==='o') answer(1);
    else if(e.key==='2'||e.key==='x') answer(0);
    else if(e.key==='3'||e.key==='?') answer(2); }
  else if(e.key===' '||e.key==='Enter'){ e.preventDefault(); nextCard(); }
});

function boot(){
  return probe().then(function(){
    if(DATA && DATA.cards) return DATA;
    return Promise.resolve(Store.get(DKEY)).then(function(v){
      try{ return v?JSON.parse(v):null; }catch(e){ return null; }
    },function(){ return null; });
  }).then(function(d){
    if(d && d.cards && d.cards.length){ initData(d); return load().then(function(){ view='home'; }); }
    view='load';
  }).then(function(){ render(); });
}
boot();
})();
</script>
